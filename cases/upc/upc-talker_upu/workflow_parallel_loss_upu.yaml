# UPC-UPU 并行网络丢包工作流
# 同时对 upc-talker, upu Pod 注入丢包故障

workflow:
  id: upc_upu_parallel_network_loss_001
  name: UPC-UPU 并行网络丢包工作流
  description: 并行对 upc-talker, upu Pod 注入丢包故障，测试系统容错能力
  execution_mode: parallel
  auto_clear: true
  
  timing:
    start_delay: 10
    task_timeout: 900
    global_timeout: 1800
    branch_start_delay: 2

  tasks:
    - id: loss_upc_talker
      name: UPC Talker 网络丢包
      case:
        name: upc_talker_loss
        type: network
        environment: 1_ssh_remote
        fault_type: loss
        pod_match:
          name:
            - upc-talker
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]

    - id: loss_upu
      name: UPU 网络丢包
      case:
        name: upu_loss
        type: network
        environment: 1_ssh_remote
        fault_type: loss
        pod_match:
          name:
            - upu-master
            - upu-slave
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]
