# UPC-UPU 串行网络数据包重复工作流
# 顺序对 upc-talker, upu Pod 注入数据包重复故障

workflow:
  id: upc_upu_serial_network_duplicate_001
  name: UPC-UPU 串行网络数据包重复工作流
  description: 顺序对 upc-talker, upu Pod 注入数据包重复故障，测试系统容错能力
  execution_mode: serial
  auto_clear: true
  
  timing:
    start_delay: 10
    node_interval: 10
    task_timeout: 900
    global_timeout: 3600

  tasks:
    - id: duplicate_upc_talker
      name: UPC Talker 网络数据包重复
      case:
        name: upc_talker_duplicate
        type: network
        environment: 1_ssh_remote
        fault_type: duplicate
        pod_match:
          name:
            - upc-talker
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]

    - id: duplicate_upu
      name: UPU 网络数据包重复
      case:
        name: upu_duplicate
        type: network
        environment: 1_ssh_remote
        fault_type: duplicate
        pod_match:
          name:
            - upu-master
            - upu-slave
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]
