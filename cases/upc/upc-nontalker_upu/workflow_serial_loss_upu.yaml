# UPC-NONTALKER-UPU 串行网络丢包工作流
# 顺序对 upc-nontalker, upu Pod 注入丢包故障

workflow:
  id: upc_nontalker_upu_serial_network_loss_001
  name: UPC-NONTALKER-UPU 串行网络丢包工作流
  description: 顺序对 upc-nontalker, upu Pod 注入丢包故障，测试系统容错能力
  execution_mode: serial
  auto_clear: true
  
  timing:
    start_delay: 10
    node_interval: 10
    task_timeout: 900
    global_timeout: 3600

  tasks:
    - id: loss_upc_nontalker
      name: UPC Nontalker 网络丢包
      case:
        name: upc_nontalker_loss
        type: network
        environment: 1_ssh_remote
        fault_type: loss
        pod_match:
          name:
            - upc-nontalker
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]

    - id: loss_upu
      name: UPU 网络丢包
      case:
        name: upu_loss
        type: network
        environment: 1_ssh_remote
        fault_type: loss
        pod_match:
          name:
            - upu-master
            - upu-slave
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]
