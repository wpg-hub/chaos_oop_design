# UPC-NONTALKER-UPU 并行进程 Kill 工作流
# 同时对 upc-nontalker, upu Pod 注入进程 kill 故障

workflow:
  id: upc_nontalker_upu_parallel_process_kill_001
  name: UPC-NONTALKER-UPU 并行进程 Kill 工作流
  description: 并行对 upc-nontalker, upu Pod 注入进程 kill 故障，测试系统恢复能力
  execution_mode: parallel
  auto_clear: true
  
  timing:
    start_delay: 10
    task_timeout: 300
    global_timeout: 600
    branch_start_delay: 2

  tasks:
    - id: kill_upc_nontalker
      name: UPC Nontalker 进程 Kill
      case:
        name: upc_nontalker_kill
        type: process
        environment: 1_ssh_remote
        fault_type: kill
        pod_match:
          name:
            - upc-nontalker
        duration: 30s
        loop_count: 5
        namespace: ns-dupf
        parameters:
          signal: random
          main_process_pid: 1

    - id: kill_upu
      name: UPU 进程 Kill
      case:
        name: upu_kill
        type: process
        environment: 1_ssh_remote
        fault_type: kill
        pod_match:
          name:
            - upu-master
            - upu-slave
        duration: 30s
        loop_count: 5
        namespace: ns-dupf
        parameters:
          signal: random
          main_process_pid: 1
