# UPC-NONTALKER-UPU 并行 Pod 删除工作流
# 同时对 upc-nontalker, upu Pod 注入删除故障

workflow:
  id: upc_nontalker_upu_parallel_pod_delete_001
  name: UPC-NONTALKER-UPU 并行 Pod 删除工作流
  description: 并行对 upc-nontalker, upu Pod 注入删除故障，测试系统恢复能力
  execution_mode: parallel
  auto_clear: true
  
  timing:
    start_delay: 10
    task_timeout: 300
    global_timeout: 600
    branch_start_delay: 2

  tasks:
    - id: delete_upc_nontalker
      name: UPC Nontalker Pod 删除
      case:
        name: upc_nontalker_delete
        type: pod
        environment: 1_ssh_remote
        fault_type: delete
        pod_match:
          name:
            - upc-nontalker
        duration: 30s
        loop_count: 5
        namespace: ns-dupf

    - id: delete_upu
      name: UPU Pod 删除
      case:
        name: upu_delete
        type: pod
        environment: 1_ssh_remote
        fault_type: delete
        pod_match:
          name:
            - upu-master
            - upu-slave
        duration: 30s
        loop_count: 5
        namespace: ns-dupf
