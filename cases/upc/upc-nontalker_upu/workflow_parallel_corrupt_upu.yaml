# UPC-NONTALKER-UPU 并行网络数据包破坏工作流
# 同时对 upc-nontalker, upu Pod 注入数据包破坏故障

workflow:
  id: upc_nontalker_upu_parallel_network_corrupt_001
  name: UPC-NONTALKER-UPU 并行网络数据包破坏工作流
  description: 并行对 upc-nontalker, upu Pod 注入数据包破坏故障，测试系统容错能力
  execution_mode: parallel
  auto_clear: true
  
  timing:
    start_delay: 10
    task_timeout: 900
    global_timeout: 1800
    branch_start_delay: 2

  tasks:
    - id: corrupt_upc_nontalker
      name: UPC Nontalker 网络数据包破坏
      case:
        name: upc_nontalker_corrupt
        type: network
        environment: 1_ssh_remote
        fault_type: corrupt
        pod_match:
          name:
            - upc-nontalker
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]

    - id: corrupt_upu
      name: UPU 网络数据包破坏
      case:
        name: upu_corrupt
        type: network
        environment: 1_ssh_remote
        fault_type: corrupt
        pod_match:
          name:
            - upu-master
            - upu-slave
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]
