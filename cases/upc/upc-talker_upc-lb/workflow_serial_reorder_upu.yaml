# UPC-TALKER-UPC-LB 串行网络数据包重排序工作流
# 顺序对 upc-talker, upc-lb Pod 注入数据包重排序故障

workflow:
  id: upc_talker_lb_serial_network_reorder_001
  name: UPC-TALKER-UPC-LB 串行网络数据包重排序工作流
  description: 顺序对 upc-talker, upc-lb Pod 注入数据包重排序故障，测试系统容错能力
  execution_mode: serial
  auto_clear: true
  
  timing:
    start_delay: 10
    node_interval: 10
    task_timeout: 900
    global_timeout: 3600

  tasks:
    - id: reorder_upc_talker
      name: UPC Talker 网络数据包重排序
      case:
        name: upc_talker_reorder
        type: network
        environment: 1_ssh_remote
        fault_type: reorder
        pod_match:
          name:
            - upc-talker
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]
          gap: ["10ms", "100ms"]

    - id: reorder_upc_lb
      name: UPC-LB 网络数据包重排序
      case:
        name: upc_lb_reorder
        type: network
        environment: 1_ssh_remote
        fault_type: reorder
        pod_match:
          name:
            - upc-lb
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]
          gap: ["10ms", "100ms"]
