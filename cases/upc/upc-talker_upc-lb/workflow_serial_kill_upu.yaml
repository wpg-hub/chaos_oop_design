# UPC-TALKER-UPC-LB 串行进程 Kill 工作流
# 顺序对 upc-talker, upc-lb Pod 注入进程 kill 故障

workflow:
  id: upc_talker_lb_serial_process_kill_001
  name: UPC-TALKER-UPC-LB 串行进程 Kill 工作流
  description: 顺序对 upc-talker, upc-lb Pod 注入进程 kill 故障，测试系统恢复能力
  execution_mode: serial
  auto_clear: true
  
  timing:
    start_delay: 10
    node_interval: 10
    task_timeout: 300
    global_timeout: 1800

  tasks:
    - id: kill_upc_talker
      name: UPC Talker 进程 Kill
      case:
        name: upc_talker_kill
        type: process
        environment: 1_ssh_remote
        fault_type: kill
        pod_match:
          name:
            - upc-talker
        duration: 30s
        loop_count: 5
        namespace: ns-dupf
        parameters:
          signal: random
          main_process_pid: 1

    - id: kill_upc_lb
      name: UPC-LB 进程 Kill
      case:
        name: upc_lb_kill
        type: process
        environment: 1_ssh_remote
        fault_type: kill
        pod_match:
          name:
            - upc-lb
        duration: 30s
        loop_count: 5
        namespace: ns-dupf
        parameters:
          signal: random
          main_process_pid: 1
