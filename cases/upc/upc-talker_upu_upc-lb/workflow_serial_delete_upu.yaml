# UPC-TALKER-UPU-UPC-LB 串行 Pod 删除工作流
# 顺序对 upc-talker, upu, upc-lb Pod 注入删除故障

workflow:
  id: upc_talker_upu_lb_serial_pod_delete_001
  name: UPC-TALKER-UPU-UPC-LB 串行 Pod 删除工作流
  description: 顺序对 upc-talker, upu, upc-lb Pod 注入删除故障，测试系统恢复能力
  execution_mode: serial
  auto_clear: true
  
  timing:
    start_delay: 10
    node_interval: 10
    task_timeout: 300
    global_timeout: 2400

  tasks:
    - id: delete_upc_talker
      name: UPC Talker Pod 删除
      case:
        name: upc_talker_delete
        type: pod
        environment: 1_ssh_remote
        fault_type: delete
        pod_match:
          name:
            - upc-talker
        duration: 30s
        loop_count: 5
        namespace: ns-dupf

    - id: delete_upu
      name: UPU Pod 删除
      case:
        name: upu_delete
        type: pod
        environment: 1_ssh_remote
        fault_type: delete
        pod_match:
          name:
            - upu-master
            - upu-slave
        duration: 30s
        loop_count: 5
        namespace: ns-dupf

    - id: delete_upc_lb
      name: UPC-LB Pod 删除
      case:
        name: upc_lb_delete
        type: pod
        environment: 1_ssh_remote
        fault_type: delete
        pod_match:
          name:
            - upc-lb
        duration: 30s
        loop_count: 5
        namespace: ns-dupf
