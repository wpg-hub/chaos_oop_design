# UPC-TALKER-UPU-UPC-LB 并行网络数据包重复工作流
# 同时对 upc-talker, upu, upc-lb Pod 注入数据包重复故障

workflow:
  id: upc_talker_upu_lb_parallel_network_duplicate_001
  name: UPC-TALKER-UPU-UPC-LB 并行网络数据包重复工作流
  description: 并行对 upc-talker, upu, upc-lb Pod 注入数据包重复故障，测试系统容错能力
  execution_mode: parallel
  auto_clear: true
  
  timing:
    start_delay: 10
    task_timeout: 900
    global_timeout: 1800
    branch_start_delay: 2

  tasks:
    - id: duplicate_upc_talker
      name: UPC Talker 网络数据包重复
      case:
        name: upc_talker_duplicate
        type: network
        environment: 1_ssh_remote
        fault_type: duplicate
        pod_match:
          name:
            - upc-talker
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]

    - id: duplicate_upu
      name: UPU 网络数据包重复
      case:
        name: upu_duplicate
        type: network
        environment: 1_ssh_remote
        fault_type: duplicate
        pod_match:
          name:
            - upu-master
            - upu-slave
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]

    - id: duplicate_upc_lb
      name: UPC-LB 网络数据包重复
      case:
        name: upc_lb_duplicate
        type: network
        environment: 1_ssh_remote
        fault_type: duplicate
        pod_match:
          name:
            - upc-lb
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]
