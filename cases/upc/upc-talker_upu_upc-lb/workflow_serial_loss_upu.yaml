# UPC-TALKER-UPU-UPC-LB 串行网络丢包工作流
# 顺序对 upc-talker, upu, upc-lb Pod 注入丢包故障

workflow:
  id: upc_talker_upu_lb_serial_network_loss_001
  name: UPC-TALKER-UPU-UPC-LB 串行网络丢包工作流
  description: 顺序对 upc-talker, upu, upc-lb Pod 注入丢包故障，测试系统容错能力
  execution_mode: serial
  auto_clear: true
  
  timing:
    start_delay: 10
    node_interval: 10
    task_timeout: 900
    global_timeout: 4800

  tasks:
    - id: loss_upc_talker
      name: UPC Talker 网络丢包
      case:
        name: upc_talker_loss
        type: network
        environment: 1_ssh_remote
        fault_type: loss
        pod_match:
          name:
            - upc-talker
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]

    - id: loss_upu
      name: UPU 网络丢包
      case:
        name: upu_loss
        type: network
        environment: 1_ssh_remote
        fault_type: loss
        pod_match:
          name:
            - upu-master
            - upu-slave
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]

    - id: loss_upc_lb
      name: UPC-LB 网络丢包
      case:
        name: upc_lb_loss
        type: network
        environment: 1_ssh_remote
        fault_type: loss
        pod_match:
          name:
            - upc-lb
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]
