# MQ 并行 Pod 删除工作流
# 对 mq Pod 注入删除故障

workflow:
  id: mq_parallel_pod_delete_001
  name: MQ 并行 Pod 删除工作流
  description: 对 mq Pod 注入删除故障，测试系统恢复能力
  execution_mode: parallel
  auto_clear: true
  
  timing:
    start_delay: 10
    task_timeout: 300
    global_timeout: 600
    branch_start_delay: 2

  tasks:
    - id: delete_mq
      name: MQ Pod 删除
      case:
        name: mq_delete
        type: pod
        environment: 1_ssh_remote
        fault_type: delete
        pod_match:
          name:
            - mq
        duration: 30s
        loop_count: 5
        namespace: ns-dupf
