# MQ 串行 Pod 删除工作流
# 顺序对 mq Pod 注入删除故障

workflow:
  id: mq_serial_pod_delete_001
  name: MQ 串行 Pod 删除工作流
  description: 顺序对 mq Pod 注入删除故障，测试系统恢复能力
  execution_mode: serial
  auto_clear: true
  
  timing:
    start_delay: 10
    node_interval: 10
    task_timeout: 300
    global_timeout: 600

  tasks:
    - id: delete_mq
      name: MQ Pod 删除
      case:
        name: mq_delete
        type: pod
        environment: 1_ssh_remote
        fault_type: delete
        pod_match:
          name:
            - mq
        duration: 30s
        loop_count: 5
        namespace: ns-dupf
