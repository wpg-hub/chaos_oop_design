# MQ 串行 Pod 停止工作流
# 顺序对 mq Pod 注入停止故障

workflow:
  id: mq_serial_pod_stop_001
  name: MQ 串行 Pod 停止工作流
  description: 顺序对 mq Pod 注入停止故障，测试系统恢复能力
  execution_mode: serial
  auto_clear: true
  
  timing:
    start_delay: 10
    node_interval: 10
    task_timeout: 300
    global_timeout: 600

  tasks:
    - id: stop_mq
      name: MQ Pod 停止
      case:
        name: mq_stop
        type: pod
        environment: 1_ssh_remote
        fault_type: stop
        pod_match:
          name:
            - mq
        duration: 30s
        loop_count: 5
        namespace: ns-dupf
