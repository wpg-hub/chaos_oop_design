# MQ 并行网络数据包重排序工作流
# 对 mq Pod 注入数据包重排序故障

workflow:
  id: mq_parallel_network_reorder_001
  name: MQ 并行网络数据包重排序工作流
  description: 对 mq Pod 注入数据包重排序故障，测试系统容错能力
  execution_mode: parallel
  auto_clear: true
  
  timing:
    start_delay: 10
    task_timeout: 900
    global_timeout: 1800
    branch_start_delay: 2

  tasks:
    - id: reorder_mq
      name: MQ 网络数据包重排序
      case:
        name: mq_reorder
        type: network
        environment: 1_ssh_remote
        fault_type: reorder
        pod_match:
          name:
            - mq
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]
          gap: ["10ms", "100ms"]
