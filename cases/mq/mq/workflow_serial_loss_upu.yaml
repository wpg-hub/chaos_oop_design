# MQ 串行网络丢包工作流
# 顺序对 mq Pod 注入丢包故障

workflow:
  id: mq_serial_network_loss_001
  name: MQ 串行网络丢包工作流
  description: 顺序对 mq Pod 注入丢包故障，测试系统容错能力
  execution_mode: serial
  auto_clear: true
  
  timing:
    start_delay: 10
    node_interval: 10
    task_timeout: 900
    global_timeout: 1800

  tasks:
    - id: loss_mq
      name: MQ 网络丢包
      case:
        name: mq_loss
        type: network
        environment: 1_ssh_remote
        fault_type: loss
        pod_match:
          name:
            - mq
        duration: 240s
        loop_count: 1
        namespace: ns-dupf
        parameters:
          percent: ["10%", "90%"]
          correlation: ["30%", "90%"]
