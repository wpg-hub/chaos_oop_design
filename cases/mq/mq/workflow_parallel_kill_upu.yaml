# MQ 并行进程 Kill 工作流
# 对 mq Pod 注入进程 kill 故障

workflow:
  id: mq_parallel_process_kill_001
  name: MQ 并行进程 Kill 工作流
  description: 对 mq Pod 注入进程 kill 故障，测试系统恢复能力
  execution_mode: parallel
  auto_clear: true
  
  timing:
    start_delay: 10
    task_timeout: 300
    global_timeout: 600
    branch_start_delay: 2

  tasks:
    - id: kill_mq
      name: MQ 进程 Kill
      case:
        name: mq_kill
        type: process
        environment: 1_ssh_remote
        fault_type: kill
        pod_match:
          name:
            - mq
        duration: 30s
        loop_count: 5
        namespace: ns-dupf
        parameters:
          signal: random
          main_process_pid: 1
